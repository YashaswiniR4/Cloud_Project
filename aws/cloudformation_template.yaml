AWSTemplateFormatVersion: '2010-09-09'
Description: >
  AI-Driven Autonomous Cloud Threat Intelligence Platform
  Module 4 Enterprise IaC Infrastructure Blueprint: Provisions Zero Trust 3-Tier VPC,
  Subnets, Security Groups, NACLs, S3 Audit Bucket, and IAM Least Privilege Roles.

Parameters:
  EnvironmentName:
    Type: String
    Default: threat-intel-prod
    Description: Environment naming prefix for resources.

  VpcCidr:
    Type: String
    Default: 10.0.0.0/16
    Description: Primary IPv4 CIDR block for the VPC.

  PublicSubnetCidr:
    Type: String
    Default: 10.0.1.0/24
    Description: CIDR block for Public Honeypot Subnet.

  PrivateAppSubnetCidr:
    Type: String
    Default: 10.0.2.0/24
    Description: CIDR block for Private Application & ML Subnet.

  PrivateDBSubnetCidr:
    Type: String
    Default: 10.0.3.0/24
    Description: CIDR block for Private Database Subnet.

Resources:
  # ==================================================================
  # 1. VIRTUAL PRIVATE CLOUD (VPC) & INTERNET GATEWAY
  # ==================================================================
  HoneypotVPC:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: !Ref VpcCidr
      EnableDnsHostnames: true
      EnableDnsSupport: true
      Tags:
        - Key: Name
          Value: !Sub '${EnvironmentName}-VPC'
        - Key: Project
          Value: CloudThreatIntelPlatform

  InternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags:
        - Key: Name
          Value: !Sub '${EnvironmentName}-IGW'

  VPCGatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref HoneypotVPC
      InternetGatewayId: !Ref InternetGateway

  # ==================================================================
  # 2. ZERO TRUST SUBNET MICRO-SEGMENTATION
  # ==================================================================
  HoneypotPublicSubnet:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref HoneypotVPC
      CidrBlock: !Ref PublicSubnetCidr
      MapPublicIpOnLaunch: true
      AvailabilityZone: !Select [0, !GetAZs '']
      Tags:
        - Key: Name
          Value: !Sub '${EnvironmentName}-PublicHoneypotSubnet'
        - Key: Tier
          Value: Public-Deception

  PrivateAppSubnet:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref HoneypotVPC
      CidrBlock: !Ref PrivateAppSubnetCidr
      MapPublicIpOnLaunch: false
      AvailabilityZone: !Select [0, !GetAZs '']
      Tags:
        - Key: Name
          Value: !Sub '${EnvironmentName}-PrivateAppSubnet'
        - Key: Tier
          Value: Private-Application

  PrivateDBSubnet:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref HoneypotVPC
      CidrBlock: !Ref PrivateDBSubnetCidr
      MapPublicIpOnLaunch: false
      AvailabilityZone: !Select [1, !GetAZs '']
      Tags:
        - Key: Name
          Value: !Sub '${EnvironmentName}-PrivateDBSubnet'
        - Key: Tier
          Value: Private-Database

  # ==================================================================
  # 3. ROUTE TABLES & ROUTING RULES
  # ==================================================================
  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref HoneypotVPC
      Tags:
        - Key: Name
          Value: !Sub '${EnvironmentName}-PublicRouteTable'

  PublicRoute:
    Type: AWS::EC2::Route
    DependsOn: VPCGatewayAttachment
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway

  PublicSubnetRouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref HoneypotPublicSubnet
      RouteTableId: !Ref PublicRouteTable

  PrivateRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref HoneypotVPC
      Tags:
        - Key: Name
          Value: !Sub '${EnvironmentName}-PrivateRouteTable'

  PrivateAppSubnetRouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PrivateAppSubnet
      RouteTableId: !Ref PrivateRouteTable

  PrivateDBSubnetRouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PrivateDBSubnet
      RouteTableId: !Ref PrivateRouteTable

  # ==================================================================
  # 4. STATEFUL FIREWALLS: SECURITY GROUPS
  # ==================================================================
  HoneypotSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Security group for Honeypot traps capturing attacker telemetry
      VpcId: !Ref HoneypotVPC
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 22
          ToPort: 22
          CidrIp: 0.0.0.0/0
          Description: SSH brute force trap port
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0
          Description: HTTP web attack trap port
        - IpProtocol: tcp
          FromPort: 2222
          ToPort: 2222
          CidrIp: 0.0.0.0/0
          Description: Custom SSH honeypot deception trap
      SecurityGroupEgress:
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 0.0.0.0/0
          Description: Restrict outbound egress strictly to HTTPS log stream API endpoints
      Tags:
        - Key: Name
          Value: !Sub '${EnvironmentName}-HoneypotSG'

  BackendSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Security group for FastAPI REST backend services
      VpcId: !Ref HoneypotVPC
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 8000
          ToPort: 8000
          CidrIp: !Ref PublicSubnetCidr
          Description: Allow API calls strictly from Public Subnet / Analyst Gateway
      SecurityGroupEgress:
        - IpProtocol: -1
          CidrIp: 0.0.0.0/0
          Description: Outbound allowed for Threat Intel API queries
      Tags:
        - Key: Name
          Value: !Sub '${EnvironmentName}-BackendSG'

  DatabaseSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Zero Trust Security Group for PostgreSQL database engine
      VpcId: !Ref HoneypotVPC
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 5432
          ToPort: 5432
          SourceSecurityGroupId: !Ref BackendSecurityGroup
          Description: STRICTLY ALLOW database queries originating from Backend SG ONLY
      SecurityGroupEgress:
        - IpProtocol: -1
          CidrIp: 10.0.0.0/16
          Description: Restrict outbound database response traffic inside VPC CIDR
      Tags:
        - Key: Name
          Value: !Sub '${EnvironmentName}-DatabaseSG'

  # ==================================================================
  # 5. AUDIT STORAGE: S3 BUCKET FOR CLOUDTRAIL LOGS
  # ==================================================================
  CloudTrailAuditBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub '${EnvironmentName}-cloudtrail-logs-${AWS::AccountId}'
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      VersioningConfiguration:
        Status: Enabled
      Tags:
        - Key: Name
          Value: !Sub '${EnvironmentName}-AuditBucket'

  # ==================================================================
  # 6. IAM LEAST PRIVILEGE ROLES & INSTANCE PROFILES (MODULE 4)
  # ==================================================================
  EC2HoneypotRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${EnvironmentName}-EC2HoneypotRole'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: EC2HoneypotLeastPrivilegePolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub 'arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/honeypot/*'
              - Effect: Deny
                Action:
                  - ec2:Create*
                  - ec2:Delete*
                  - iam:*
                Resource: '*'

  EC2HoneypotInstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      InstanceProfileName: !Sub '${EnvironmentName}-EC2HoneypotInstanceProfile'
      Roles:
        - !Ref EC2HoneypotRole

  LambdaRemediationRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${EnvironmentName}-LambdaRemediationRole'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: LambdaRemediationLeastPrivilegePolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - ec2:RevokeSecurityGroupIngress
                  - ec2:AuthorizeSecurityGroupIngress
                  - ec2:DescribeSecurityGroups
                Resource: '*'
                Condition:
                  StringEquals:
                    aws:ResourceTag/Project: CloudThreatIntelPlatform
              - Effect: Allow
                Action:
                  - sns:Publish
                Resource: !Sub 'arn:aws:sns:${AWS::Region}:${AWS::AccountId}:threat-intel-alerts-topic'

  CloudTrailDeliveryRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${EnvironmentName}-CloudTrailDeliveryRole'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: cloudtrail.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: CloudTrailDeliveryPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - s3:GetBucketAcl
                Resource: !GetAtt CloudTrailAuditBucket.Arn
              - Effect: Allow
                Action:
                  - s3:PutObject
                Resource: !Sub '${CloudTrailAuditBucket.Arn}/AWSLogs/*'
                Condition:
                  StringEquals:
                    s3:x-amz-acl: bucket-owner-full-control

Outputs:
  VPCId:
    Description: VPC ID of the Honeypot Infrastructure
    Value: !Ref HoneypotVPC

  HoneypotInstanceProfileArn:
    Description: EC2 Honeypot Instance Profile ARN
    Value: !GetAtt EC2HoneypotInstanceProfile.Arn

  LambdaRemediationRoleArn:
    Description: Lambda Incident Response Role ARN
    Value: !GetAtt LambdaRemediationRole.Arn

  CloudTrailDeliveryRoleArn:
    Description: CloudTrail Audit Delivery Role ARN
    Value: !GetAtt CloudTrailDeliveryRole.Arn
