AWSTemplateFormatVersion: '2010-09-09'
Description: >
  AI-Driven Autonomous Cloud Threat Intelligence Platform
  Module 5 Enterprise IaC Blueprint: Provisions Zero Trust 3-Tier VPC, Subnets,
  Security Groups, NACLs, S3 WORM Bucket, IAM Roles, CloudWatch Log Group, CloudTrail,
  and AWS Free Tier EC2 Honeypot Host with Docker & Cowrie Deception Container.

Parameters:
  EnvironmentName:
    Type: String
    Default: threat-intel-prod
    Description: Environment naming prefix for resources.

  InstanceType:
    Type: String
    Default: t2.micro
    AllowedValues: [t2.micro, t3.micro]
    Description: AWS Free Tier compatible EC2 instance type.

  VpcCidr:
    Type: String
    Default: 10.0.0.0/16
    Description: Primary IPv4 CIDR block for the VPC.

  PublicSubnetCidr:
    Type: String
    Default: 10.0.1.0/24
    Description: CIDR block for Public Honeypot Subnet.

  PrivateAppSubnetCidr:
    Type: String
    Default: 10.0.2.0/24
    Description: CIDR block for Private Application & ML Subnet.

  PrivateDBSubnetCidr:
    Type: String
    Default: 10.0.3.0/24
    Description: CIDR block for Private Database Subnet.

Mappings:
  RegionMap:
    us-east-1:
      AMI: ami-0c7217cdde317cfec # Ubuntu 22.04 LTS us-east-1
    us-east-2:
      AMI: ami-05fb0b8c1424f266b # Ubuntu 22.04 LTS us-east-2
    us-west-2:
      AMI: ami-008fe2fc65df48daf # Ubuntu 22.04 LTS us-west-2
    eu-west-1:
      AMI: ami-0d940f23d527c3ab1 # Ubuntu 22.04 LTS eu-west-1

Resources:
  # ==================================================================
  # 1. VIRTUAL PRIVATE CLOUD (VPC) & INTERNET GATEWAY
  # ==================================================================
  HoneypotVPC:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: !Ref VpcCidr
      EnableDnsHostnames: true
      EnableDnsSupport: true
      Tags:
        - Key: Name
          Value: !Sub '${EnvironmentName}-VPC'
        - Key: Project
          Value: CloudThreatIntelPlatform

  InternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags:
        - Key: Name
          Value: !Sub '${EnvironmentName}-IGW'

  VPCGatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref HoneypotVPC
      InternetGatewayId: !Ref InternetGateway

  # ==================================================================
  # 2. ZERO TRUST SUBNET MICRO-SEGMENTATION
  # ==================================================================
  HoneypotPublicSubnet:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref HoneypotVPC
      CidrBlock: !Ref PublicSubnetCidr
      MapPublicIpOnLaunch: true
      AvailabilityZone: !Select [0, !GetAZs '']
      Tags:
        - Key: Name
          Value: !Sub '${EnvironmentName}-PublicHoneypotSubnet'
        - Key: Tier
          Value: Public-Deception

  PrivateAppSubnet:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref HoneypotVPC
      CidrBlock: !Ref PrivateAppSubnetCidr
      MapPublicIpOnLaunch: false
      AvailabilityZone: !Select [0, !GetAZs '']
      Tags:
        - Key: Name
          Value: !Sub '${EnvironmentName}-PrivateAppSubnet'
        - Key: Tier
          Value: Private-Application

  PrivateDBSubnet:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref HoneypotVPC
      CidrBlock: !Ref PrivateDBSubnetCidr
      MapPublicIpOnLaunch: false
      AvailabilityZone: !Select [1, !GetAZs '']
      Tags:
        - Key: Name
          Value: !Sub '${EnvironmentName}-PrivateDBSubnet'
        - Key: Tier
          Value: Private-Database

  # ==================================================================
  # 3. ROUTE TABLES & ROUTING RULES
  # ==================================================================
  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref HoneypotVPC
      Tags:
        - Key: Name
          Value: !Sub '${EnvironmentName}-PublicRouteTable'

  PublicRoute:
    Type: AWS::EC2::Route
    DependsOn: VPCGatewayAttachment
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway

  PublicSubnetRouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref HoneypotPublicSubnet
      RouteTableId: !Ref PublicRouteTable

  PrivateRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref HoneypotVPC
      Tags:
        - Key: Name
          Value: !Sub '${EnvironmentName}-PrivateRouteTable'

  PrivateAppSubnetRouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PrivateAppSubnet
      RouteTableId: !Ref PrivateRouteTable

  PrivateDBSubnetRouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PrivateDBSubnet
      RouteTableId: !Ref PrivateRouteTable

  # ==================================================================
  # 4. STATEFUL FIREWALLS: SECURITY GROUPS
  # ==================================================================
  HoneypotSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Security group for Honeypot traps capturing attacker telemetry
      VpcId: !Ref HoneypotVPC
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 22
          ToPort: 22
          CidrIp: 0.0.0.0/0
          Description: SSH trap port for Cowrie honeypot
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0
          Description: HTTP web attack trap port
        - IpProtocol: tcp
          FromPort: 2222
          ToPort: 2222
          CidrIp: 0.0.0.0/0
          Description: Custom SSH honeypot deception trap
      SecurityGroupEgress:
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 0.0.0.0/0
          Description: Restrict outbound egress strictly to HTTPS CloudWatch log stream API endpoints
      Tags:
        - Key: Name
          Value: !Sub '${EnvironmentName}-HoneypotSG'
        - Key: Project
          Value: CloudThreatIntelPlatform

  BackendSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Security group for REST backend services
      VpcId: !Ref HoneypotVPC
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 8000
          ToPort: 8000
          CidrIp: !Ref PublicSubnetCidr
          Description: Allow API calls strictly from Public Subnet / Analyst Gateway
      SecurityGroupEgress:
        - IpProtocol: -1
          CidrIp: 0.0.0.0/0
          Description: Outbound allowed for Threat Intel API queries
      Tags:
        - Key: Name
          Value: !Sub '${EnvironmentName}-BackendSG'

  DatabaseSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Zero Trust Security Group for PostgreSQL database engine
      VpcId: !Ref HoneypotVPC
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 5432
          ToPort: 5432
          SourceSecurityGroupId: !Ref BackendSecurityGroup
          Description: STRICTLY ALLOW database queries originating from Backend SG ONLY
      SecurityGroupEgress:
        - IpProtocol: -1
          CidrIp: 10.0.0.0/16
          Description: Restrict outbound database response traffic inside VPC CIDR
      Tags:
        - Key: Name
          Value: !Sub '${EnvironmentName}-DatabaseSG'

  # ==================================================================
  # 5. AUDIT STORAGE: S3 BUCKET & CLOUDWATCH LOG GROUP
  # ==================================================================
  CloudTrailAuditBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub '${EnvironmentName}-cloudtrail-logs-${AWS::AccountId}'
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      VersioningConfiguration:
        Status: Enabled
      Tags:
        - Key: Name
          Value: !Sub '${EnvironmentName}-AuditBucket'

  CloudTrailAuditBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref CloudTrailAuditBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: AWSCloudTrailAclCheck
            Effect: Allow
            Principal:
              Service: cloudtrail.amazonaws.com
            Action: s3:GetBucketAcl
            Resource: !GetAtt CloudTrailAuditBucket.Arn
          - Sid: AWSCloudTrailWrite
            Effect: Allow
            Principal:
              Service: cloudtrail.amazonaws.com
            Action: s3:PutObject
            Resource: !Sub '${CloudTrailAuditBucket.Arn}/AWSLogs/${AWS::AccountId}/*'
            Condition:
              StringEquals:
                s3:x-amz-acl: bucket-owner-full-control

  HoneypotCloudWatchLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /aws/honeypot/telemetry
      RetentionInDays: 30

  PlatformCloudTrail:
    Type: AWS::CloudTrail::Trail
    DependsOn: CloudTrailAuditBucketPolicy
    Properties:
      TrailName: !Sub '${EnvironmentName}-CloudTrail'
      S3BucketName: !Ref CloudTrailAuditBucket
      IsLogging: true
      IncludeGlobalServiceEvents: true
      IsMultiRegionTrail: true
      EnableLogFileValidation: true
      CloudWatchLogsLogGroupArn: !GetAtt HoneypotCloudWatchLogGroup.Arn
      CloudWatchLogsRoleArn: !GetAtt CloudTrailDeliveryRole.Arn
      Tags:
        - Key: Name
          Value: !Sub '${EnvironmentName}-CloudTrail'

  # ==================================================================
  # 6. IAM LEAST PRIVILEGE ROLES & INSTANCE PROFILES
  # ==================================================================
  EC2HoneypotRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${EnvironmentName}-EC2HoneypotRole'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: EC2HoneypotLeastPrivilegePolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub 'arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/honeypot/*'
              - Effect: Deny
                Action:
                  - ec2:Create*
                  - ec2:Delete*
                  - iam:*
                Resource: '*'

  EC2HoneypotInstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      InstanceProfileName: !Sub '${EnvironmentName}-EC2HoneypotInstanceProfile'
      Roles:
        - !Ref EC2HoneypotRole

  LambdaRemediationRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${EnvironmentName}-LambdaRemediationRole'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: LambdaRemediationLeastPrivilegePolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - ec2:RevokeSecurityGroupIngress
                  - ec2:AuthorizeSecurityGroupIngress
                  - ec2:DescribeSecurityGroups
                Resource: '*'
                Condition:
                  StringEquals:
                    aws:ResourceTag/Project: CloudThreatIntelPlatform
              - Effect: Allow
                Action:
                  - sns:Publish
                Resource: !Sub 'arn:aws:sns:${AWS::Region}:${AWS::AccountId}:threat-intel-alerts-topic'

  CloudTrailDeliveryRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${EnvironmentName}-CloudTrailDeliveryRole'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: cloudtrail.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: CloudTrailDeliveryPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !GetAtt HoneypotCloudWatchLogGroup.Arn

  # ==================================================================
  # 7. AWS FREE TIER EC2 HONEYPOT HOST
  # ==================================================================
  EC2HoneypotInstance:
    Type: AWS::EC2::Instance
    Properties:
      InstanceType: !Ref InstanceType
      ImageId: !FindInMap [RegionMap, !Ref 'AWS::Region', AMI]
      SubnetId: !Ref HoneypotPublicSubnet
      SecurityGroupIds:
        - !Ref HoneypotSecurityGroup
      IamInstanceProfile: !Ref EC2HoneypotInstanceProfile
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          set -euo pipefail

          # Update system & install Docker + Python
          apt-get update -y
          apt-get install -y docker.io python3 python3-pip rsyslog curl git

          systemctl enable --now docker

          # Create log dir
          mkdir -p /var/log/honeypot
          chmod 755 /var/log/honeypot

          # Deploy Cowrie SSH Honeypot Docker Container on port 22
          docker run -d --name cowrie-ssh-honeypot \
            -p 22:2222 \
            -p 2222:2222 \
            --restart always \
            cowrie/cowrie:latest || true

          # Start lightweight HTTP Honeypot Trap
          cat << 'EOF' > /usr/local/bin/http_honeypot.py
          import http.server
          import json
          import datetime

          class HoneypotHandler(http.server.BaseHTTPRequestHandler):
              def do_GET(self):
                  log = {"time": str(datetime.datetime.now()), "ip": self.client_address[0], "path": self.path}
                  with open("/var/log/honeypot/http_requests.log", "a") as f:
                      f.write(json.dumps(log) + "\n")
                  self.send_response(200)
                  self.end_headers()
                  self.wfile.write(b"<html><body><h1>System Maintenance</h1></body></html>")
              do_POST = do_GET

          httpd = http.server.HTTPServer(('0.0.0.0', 80), HoneypotHandler)
          httpd.serve_forever()
          EOF

          python3 /usr/local/bin/http_honeypot.py &

          echo "[+] EC2 Honeypot Bootstrap Completed." > /var/log/honeypot/status.log
      Tags:
        - Key: Name
          Value: !Sub '${EnvironmentName}-EC2Honeypot'
        - Key: Project
          Value: CloudThreatIntelPlatform

Outputs:
  VPCId:
    Description: VPC ID of the Honeypot Infrastructure
    Value: !Ref HoneypotVPC

  EC2HoneypotPublicIp:
    Description: Public IPv4 address of the EC2 Honeypot Host
    Value: !GetAtt EC2HoneypotInstance.PublicIp

  EC2HoneypotInstanceId:
    Description: EC2 Instance ID
    Value: !Ref EC2HoneypotInstance

  HoneypotSecurityGroupId:
    Description: Security Group ID for Honeypot Traps
    Value: !Ref HoneypotSecurityGroup

  CloudTrailArn:
    Description: AWS CloudTrail Trail ARN
    Value: !GetAtt PlatformCloudTrail.Arn
