AWSTemplateFormatVersion: '2010-09-09'
Description: >
  AI-Driven Autonomous Cloud Threat Intelligence Platform
  Module 3 Enterprise IaC Infrastructure Blueprint: Provisions Zero Trust 3-Tier VPC,
  Public & Private Subnets, Route Tables, Internet Gateway, Security Groups, and NACLs.

Parameters:
  EnvironmentName:
    Type: String
    Default: threat-intel-prod
    Description: Environment naming prefix for resources.

  VpcCidr:
    Type: String
    Default: 10.0.0.0/16
    Description: Primary IPv4 CIDR block for the VPC.

  PublicSubnetCidr:
    Type: String
    Default: 10.0.1.0/24
    Description: CIDR block for Public Honeypot Subnet.

  PrivateAppSubnetCidr:
    Type: String
    Default: 10.0.2.0/24
    Description: CIDR block for Private Application & ML Subnet.

  PrivateDBSubnetCidr:
    Type: String
    Default: 10.0.3.0/24
    Description: CIDR block for Private Database Subnet.

Resources:
  # ==================================================================
  # 1. VIRTUAL PRIVATE CLOUD (VPC) & INTERNET GATEWAY
  # ==================================================================
  HoneypotVPC:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: !Ref VpcCidr
      EnableDnsHostnames: true
      EnableDnsSupport: true
      Tags:
        - Key: Name
          Value: !Sub '${EnvironmentName}-VPC'
        - Key: Project
          Value: CloudThreatIntelPlatform

  InternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags:
        - Key: Name
          Value: !Sub '${EnvironmentName}-IGW'

  VPCGatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref HoneypotVPC
      InternetGatewayId: !Ref InternetGateway

  # ==================================================================
  # 2. ZERO TRUST SUBNET MICRO-SEGMENTATION
  # ==================================================================
  # Subnet Tier 1: Public Honeypot Subnet
  HoneypotPublicSubnet:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref HoneypotVPC
      CidrBlock: !Ref PublicSubnetCidr
      MapPublicIpOnLaunch: true
      AvailabilityZone: !Select [0, !GetAZs '']
      Tags:
        - Key: Name
          Value: !Sub '${EnvironmentName}-PublicHoneypotSubnet'
        - Key: Tier
          Value: Public-Deception

  # Subnet Tier 2: Private Application & ML Backend Subnet
  PrivateAppSubnet:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref HoneypotVPC
      CidrBlock: !Ref PrivateAppSubnetCidr
      MapPublicIpOnLaunch: false
      AvailabilityZone: !Select [0, !GetAZs '']
      Tags:
        - Key: Name
          Value: !Sub '${EnvironmentName}-PrivateAppSubnet'
        - Key: Tier
          Value: Private-Application

  # Subnet Tier 3: Private Isolated Database Subnet
  PrivateDBSubnet:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref HoneypotVPC
      CidrBlock: !Ref PrivateDBSubnetCidr
      MapPublicIpOnLaunch: false
      AvailabilityZone: !Select [1, !GetAZs '']
      Tags:
        - Key: Name
          Value: !Sub '${EnvironmentName}-PrivateDBSubnet'
        - Key: Tier
          Value: Private-Database

  # ==================================================================
  # 3. ROUTE TABLES & ROUTING RULES
  # ==================================================================
  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref HoneypotVPC
      Tags:
        - Key: Name
          Value: !Sub '${EnvironmentName}-PublicRouteTable'

  PublicRoute:
    Type: AWS::EC2::Route
    DependsOn: VPCGatewayAttachment
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway

  PublicSubnetRouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref HoneypotPublicSubnet
      RouteTableId: !Ref PublicRouteTable

  PrivateRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref HoneypotVPC
      Tags:
        - Key: Name
          Value: !Sub '${EnvironmentName}-PrivateRouteTable'

  PrivateAppSubnetRouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PrivateAppSubnet
      RouteTableId: !Ref PrivateRouteTable

  PrivateDBSubnetRouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PrivateDBSubnet
      RouteTableId: !Ref PrivateRouteTable

  # ==================================================================
  # 4. STATEFUL FIREWALLS: SECURITY GROUPS
  # ==================================================================
  # Security Group 1: Honeypot Traps (Public)
  HoneypotSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Security group for Honeypot traps capturing attacker telemetry
      VpcId: !Ref HoneypotVPC
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 22
          ToPort: 22
          CidrIp: 0.0.0.0/0
          Description: SSH brute force trap port
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0
          Description: HTTP web attack trap port
        - IpProtocol: tcp
          FromPort: 2222
          ToPort: 2222
          CidrIp: 0.0.0.0/0
          Description: Custom SSH honeypot deception trap
      SecurityGroupEgress:
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 0.0.0.0/0
          Description: Restrict outbound egress strictly to HTTPS log stream API endpoints
      Tags:
        - Key: Name
          Value: !Sub '${EnvironmentName}-HoneypotSG'

  # Security Group 2: FastAPI Backend Microservice (Private App Subnet)
  BackendSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Security group for FastAPI REST backend services
      VpcId: !Ref HoneypotVPC
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 8000
          ToPort: 8000
          CidrIp: !Ref PublicSubnetCidr
          Description: Allow API calls strictly from Public Subnet / Analyst Gateway
      SecurityGroupEgress:
        - IpProtocol: -1
          CidrIp: 0.0.0.0/0
          Description: Outbound allowed for Threat Intel API queries
      Tags:
        - Key: Name
          Value: !Sub '${EnvironmentName}-BackendSG'

  # Security Group 3: PostgreSQL Database (Private DB Subnet)
  DatabaseSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Zero Trust Security Group for PostgreSQL database engine
      VpcId: !Ref HoneypotVPC
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 5432
          ToPort: 5432
          SourceSecurityGroupId: !Ref BackendSecurityGroup
          Description: STRICTLY ALLOW database queries originating from Backend SG ONLY
      SecurityGroupEgress:
        - IpProtocol: -1
          CidrIp: 10.0.0.0/16
          Description: Restrict outbound database response traffic inside VPC CIDR
      Tags:
        - Key: Name
          Value: !Sub '${EnvironmentName}-DatabaseSG'

  # ==================================================================
  # 5. STATELESS FIREWALLS: NETWORK ACCESS CONTROL LISTS (NACLs)
  # ==================================================================
  PublicSubnetNACL:
    Type: AWS::EC2::NetworkAcl
    Properties:
      VpcId: !Ref HoneypotVPC
      Tags:
        - Key: Name
          Value: !Sub '${EnvironmentName}-PublicNACL'

  InboundPublicNACLRule:
    Type: AWS::EC2::NetworkAclEntry
    Properties:
      NetworkAclId: !Ref PublicSubnetNACL
      RuleNumber: 100
      Protocol: 6 # TCP
      RuleAction: allow
      Egress: false
      CidrBlock: 0.0.0.0/0
      PortRange:
        From: 1
        To: 65535

  OutboundPublicNACLRule:
    Type: AWS::EC2::NetworkAclEntry
    Properties:
      NetworkAclId: !Ref PublicSubnetNACL
      RuleNumber: 100
      Protocol: 6 # TCP
      RuleAction: allow
      Egress: true
      CidrBlock: 0.0.0.0/0
      PortRange:
        From: 1
        To: 65535

  PublicSubnetNACLAssociation:
    Type: AWS::EC2::SubnetNetworkAclAssociation
    Properties:
      SubnetId: !Ref HoneypotPublicSubnet
      NetworkAclId: !Ref PublicSubnetNACL

  PrivateSubnetNACL:
    Type: AWS::EC2::NetworkAcl
    Properties:
      VpcId: !Ref HoneypotVPC
      Tags:
        - Key: Name
          Value: !Sub '${EnvironmentName}-PrivateNACL'

  InboundPrivateNACLRule:
    Type: AWS::EC2::NetworkAclEntry
    Properties:
      NetworkAclId: !Ref PrivateSubnetNACL
      RuleNumber: 100
      Protocol: 6 # TCP
      RuleAction: allow
      Egress: false
      CidrBlock: 10.0.0.0/16
      PortRange:
        From: 1
        To: 65535

  OutboundPrivateNACLRule:
    Type: AWS::EC2::NetworkAclEntry
    Properties:
      NetworkAclId: !Ref PrivateSubnetNACL
      RuleNumber: 100
      Protocol: 6 # TCP
      RuleAction: allow
      Egress: true
      CidrBlock: 10.0.0.0/16
      PortRange:
        From: 1
        To: 65535

  PrivateAppSubnetNACLAssociation:
    Type: AWS::EC2::SubnetNetworkAclAssociation
    Properties:
      SubnetId: !Ref PrivateAppSubnet
      NetworkAclId: !Ref PrivateSubnetNACL

  PrivateDBSubnetNACLAssociation:
    Type: AWS::EC2::SubnetNetworkAclAssociation
    Properties:
      SubnetId: !Ref PrivateDBSubnet
      NetworkAclId: !Ref PrivateSubnetNACL

  # ==================================================================
  # 6. AUDIT STORAGE: S3 BUCKET FOR CLOUDTRAIL LOGS
  # ==================================================================
  CloudTrailAuditBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub '${EnvironmentName}-cloudtrail-logs-${AWS::AccountId}'
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      VersioningConfiguration:
        Status: Enabled
      Tags:
        - Key: Name
          Value: !Sub '${EnvironmentName}-AuditBucket'

Outputs:
  VPCId:
    Description: VPC ID of the Honeypot Infrastructure
    Value: !Ref HoneypotVPC

  PublicSubnetId:
    Description: Public Subnet ID
    Value: !Ref HoneypotPublicSubnet

  PrivateAppSubnetId:
    Description: Private Application Subnet ID
    Value: !Ref PrivateAppSubnet

  PrivateDBSubnetId:
    Description: Private Database Subnet ID
    Value: !Ref PrivateDBSubnet

  HoneypotSecurityGroupId:
    Description: Honeypot Security Group ID
    Value: !Ref HoneypotSecurityGroup

  BackendSecurityGroupId:
    Description: Backend Application Security Group ID
    Value: !Ref BackendSecurityGroup

  DatabaseSecurityGroupId:
    Description: Database Security Group ID
    Value: !Ref DatabaseSecurityGroup

  S3AuditBucketName:
    Description: Encrypted S3 Audit Bucket Name
    Value: !Ref CloudTrailAuditBucket
